name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[ddg,web,dev]"

      - name: Run pytest suite
        run: pytest -q

      - name: Validate frontend JavaScript syntax
        run: |
          python -c "import re, pathlib, subprocess; html = pathlib.Path('deep_research/web/static/index.html').read_text(encoding='utf-8'); m = re.findall(r'<script>([\s\S]*?)</script>', html); p = pathlib.Path('/tmp/ui_check.js'); p.write_text(m[-1], encoding='utf-8'); subprocess.run(['node', '--check', str(p)], check=True)"
